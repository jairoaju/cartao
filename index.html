<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Ícone que aparece no navegador. Os demais estão no manifest.json -->
    <link rel="icon" href="icon-192.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciador de Cartão de Crédito</title>
    <link rel="manifest" href="manifest.json">
    <!-- sql.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CABEÇALHO -->
    <header>
        <h1 class="header-title">Cartões JKJ</h1>
        
        <!-- MENU HAMBÚRGUER DE OPÇÕES Todos os ícones estão em SVG -->
        <div class="menu-container">

            <button id="btn-menu-principal" onclick="alternarMenuOpcoes(event)" title="Menu de Opções">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>           

            <div id="dropdown-menu-opcoes" class="hidden">
                <!-- Modo Claro / Escuro -->
                <button onclick="alternarTema(); fecharMenuOpcoes();" class="dropdown-item">
                    <span id="icone-menu-tema" style="display: inline-flex; align-items: center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </span> 
                    <span id="texto-menu-tema">Modo Claro</span>
                </button>

                <div class="dropdown-divider"></div>

                <!-- Exportar Backup (Download) -->
                <button onclick="exportarBackup(); fecharMenuOpcoes();" class="dropdown-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Exportar Backup
                </button>

                <!-- Importar Backup (Upload) -->
                <label class="dropdown-item" style="cursor: pointer;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Importar Backup
                    <input type="file" id="input-importar-menu" accept=".sqlite" onchange="importarBackup(event); fecharMenuOpcoes();" class="hidden">
                </label>

                <div class="dropdown-divider"></div>

                <!-- Compartilhar Fatura -->
                <button onclick="abrirModalExportarPdf(); fecharMenuOpcoes();" class="dropdown-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    Compartilhar Fatura
                </button>
            </div>            

        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <!-- Alerta de Feedback -->
        <div id="app-alerta" class="app-alerta-box hidden"></div>

        <!-- Abas de Navegação -->
        <nav>
            <button id="tab-lancamentos" class="tab-btn tab-ativa" onclick="mudarAba('lancamentos')">Lançamentos</button>
            <button id="tab-resumo" class="tab-btn tab-inativa" onclick="mudarAba('resumo')">Resumo por Cartão</button>
        </nav>

        <!-- SEÇÃO: LANÇAMENTOS -->
        <section id="secao-lancamentos" class="flex flex-col gap-3">
            <!-- Formulário -->
            <div class="glass-card card-formulario">
                <h2 id="titulo-formulario" class="form-title">Novo Lançamento</h2>
                
                <div class="flex flex-col gap-3">
                    
                <!-- Linha: Data da Compra e Fatura Lado a Lado -->
                <div class="grid-data-fatura">
                    <div style="grid-column: span 11 / span 11;">
                        <label>Data da Compra</label>
                        <input type="date" id="input-data" onchange="aoMudarDataCompra(); verificarPreenchimentoFormulario()">
                    </div>
                    
                    <div style="grid-column: span 13 / span 13;">
                        <label>Mês da Fatura</label>
                        <input type="month" id="input-fatura" onchange="verificarPreenchimentoFormulario()" oninput="verificarPreenchimentoFormulario()" onblur="garantirFaturaValida()">
                    </div>
                </div>
                    
                    <!-- Seleção de Cartão com Grid Proporcional -->
                    <div>
                        <label>Cartão</label>
                        <div class="grid-data-fatura">
                            <div style="grid-column: span 10 / span 10;">
                                <div id="card-cartao-visa10" class="pill-card card-cartao-especial ativo" onclick="selecionarCartao('Visa - 10')" style="width: 100%;">
                                    <span class="cartao-img-container">
                                        <img src="./imagens/visa-10.png" alt="Visa Platinum" class="cartao-img">
                                    </span>

                                    <!-- Célula vazia de espaçamento entre a imagem e o texto -->
                                    <span style="width: 12px; display: inline-block;"></span>

                                    <span class="cartao-texto">Venc. 10</span>
                                </div>
                            </div>
                            
                            <!-- Espaçamento central proporcional (2 colunas) -->
                            <div style="grid-column: span 2 / span 2;"></div>

                            <div style="grid-column: span 10 / span 10;">
                                <div id="card-cartao-visa25" class="pill-card card-cartao-especial" onclick="selecionarCartao('Visa - 25')" style="width: 100%;">
                                    <span class="cartao-img-container">
                                        <img src="./imagens/visa-25.png" alt="Visa Infinite" class="cartao-img">
                                    </span>
                                    <!-- Célula vazia de espaçamento entre a imagem e o texto -->
                                    <span style="width: 12px; display: inline-block;"></span>                                    
                                    <span class="cartao-texto">Venc. 25</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Seleção de Usuário -->
                    <div>
                        <div class="selecao-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                            <div id="card-usuario-jairo" class="pill-card ativo" onclick="selecionarUsuario('Jairo')">Jairo</div>
                            <div id="card-usuario-katia" class="pill-card" onclick="selecionarUsuario('Kátia')">Kátia</div>
                            <div id="card-usuario-juliana" class="pill-card" onclick="selecionarUsuario('Juliana')">Juliana</div>
                        </div>
                    </div>

                    <div>
                        <label>Estabelecimento</label>
                        <input type="text" id="input-estabelecimento" placeholder="Ex: Supermercado" oninput="verificarPreenchimentoFormulario()">
                    </div>

                    <div class="grid-data-cartao">
                        <div style="grid-column: span 6 / span 6;">
                            <label>Valor Total (R$)</label>
                            <input type="number" step="0.01" id="input-valor" class="font-mono" placeholder="0,00" oninput="verificarPreenchimentoFormulario()">
                        </div>
                        <div style="grid-column: span 6 / span 6;">
                            <label>Parcelas</label>
                            <input type="number" min="1" value="1" id="input-parcelas-total" class="font-mono" oninput="verificarPreenchimentoFormulario()">
                        </div>
                    </div>

                    <!-- Botões de Ação -->
                    <div>
                        <button id="btn-salvar" class="btn-acao btn-desativado" onclick="salvarOuAtualizarRegistro()" disabled>Salvar Lançamento</button>
                        
                        <div id="botoes-edicao-container" class="botoes-edicao-container">
                            <button id="btn-cancela" class="btn-acao btn-cancela-edicao" onclick="cancelarEdicao()">Cancelar</button>
                            <button id="btn-confirma" class="btn-acao btn-confirma-edicao" onclick="salvarOuAtualizarRegistro()" disabled>Atualizar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de Lançamentos do Mês -->
            <div class="glass-card">
                <div class="flex justify-between items-center historico-header">
                    <button onclick="mudarMesHistorico(-1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">◀</button>
                    <span id="label-mes-filtro" class="historico-title" style="font-size: 12px;">Fatura: ---</span>
                    <button onclick="mudarMesHistorico(1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">▶</button>
                </div>

                <ul id="lista-registros" class="lista-vazia-ul overflow-y-auto max-h-registros">
                    <!-- Preenchido via JS -->
                </ul>

                <div id="total-geral" style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border-light); font-size: 12px; font-weight: bold; text-align: right;" class="font-mono badge-total">
                    Total: R$ 0,00
                </div>
            </div>
        </section>

        <!-- SEÇÃO: RESUMO POR CARTÃO -->
        <section id="secao-resumo" class="hidden flex-col gap-3">
            <div class="glass-card">
                <div class="flex justify-between items-center historico-header">
                    <button onclick="mudarMesResumo(-1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">◀</button>
                    <span id="label-mes-resumo" class="resumo-main-title" style="font-size: 12px;">Fatura: ---</span>
                    <button onclick="mudarMesResumo(1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">▶</button>
                </div>

                <div id="conteudo-resumo" class="conteudo-resumo-flex overflow-y-auto max-h-resumo">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- módulo de exportação PDF -->
    <script src="pdfExport.js"></script>

    <!-- script principal -->
    <script src="app.js"></script>



    <!-- MODAL DE EXPORTAÇÃO DE PDF -->
    <div id="modal-exportar-pdf" class="hidden" style="position: fixed; inset: 0; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div class="glass-card" style="width: 90%; max-width: 360px; background-color: var(--card-light); padding: 1.25rem;">
            <h3 class="form-title" style="margin-bottom: 1rem;">Compartilhar</h3>
            
            <div class="flex flex-col gap-3">
                <!-- Seleção de Mês/Ano -->
                <div>
                    <label>Mês da Fatura</label>
                    <input type="month" id="pdf-modal-mes" style="width: 100%;">
                </div>

                <!-- Seleção de Cartão -->
                <div>
                    <label>Cartão</label>
                    <select id="pdf-modal-cartao" style="width: 100%;">
                        <option value="Todos">Todos os Cartões</option>
                        <option value="Visa - 10">Visa - 10</option>
                        <option value="Visa - 25">Visa - 25</option>
                    </select>
                </div>

                <!-- Seleção de Usuário -->
                <div>
                    <label>Usuário / Dono</label>
                    <select id="pdf-modal-usuario" style="width: 100%;">
                        <option value="Todos">Todos os Usuários</option>
                        <option value="Jairo">Jairo</option>
                        <option value="Kátia">Kátia</option>
                        <option value="Juliana">Juliana</option>
                    </select>
                </div>

                <!-- Botões de Ação do Modal -->
                <div class="flex gap-2" style="margin-top: 0.5rem;">
                    <button onclick="fecharModalExportarPdf()" class="btn-acao btn-cancela-edicao" style="flex: 1;">Cancelar</button>
                    <button onclick="confirmarExportacaoPDF()" class="btn-acao btn-salvar-ativo" style="flex: 1;">Compartilhar Fatura</button>
                </div>
            </div>
        </div>
    </div>





</body>
</html>
