<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" id="meta-theme-color">
    <title>Controle de Gastos do Cartão</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="header-icon">💳</span>
            <h1 class="header-title">Cartões</h1>
        </div>
        <button id="btn-tema" class="btn-tema" onclick="alternarTema()" title="Alternar Tema">🌙</button>
    </header>

    <nav>
        <button id="tab-lancamentos" class="tab-btn tab-ativa" onclick="mudarAba('lancamentos')">📝 Lançamentos</button>
        <button id="tab-resumo" class="tab-btn tab-inativa" onclick="mudarAba('resumo')">📊 Resumo por Cartão</button>
    </nav>

    <main>
        <!-- SEÇÃO: LANÇAMENTOS -->
        <section id="secao-lancamentos" class="flex flex-col gap-3">
            
            <!-- Formulário -->
            <div class="glass-card card-formulario">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <p id="titulo-formulario" class="form-title" style="margin: 0;">Novo Lançamento</p>
                    <div style="display: flex; align-items: center; gap: 0.375rem;">
                        <span style="font-size: 11px; font-weight: 600; color: var(--text-muted-light);">Fatura:</span>
                        <!-- Container unificado: o input nativo fica invisível por cima cobrindo 100% da área do botão visual -->
                        <div style="position: relative; display: inline-block; height: 26px;">
                            <span id="fatura-visual" class="tab-btn tab-ativa" style="display: inline-flex; align-items: center; justify-content: center; padding: 0.2rem 0.6rem; font-size: 11px; border-radius: 0.5rem; height: 100%; min-width: 65px; box-sizing: border-box; pointer-events: none;">Out/26</span>
                            <input type="month" id="input-fatura" onchange="atualizarTextoFaturaVisual()" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10;">
                        </div>
                    </div>
                </div>

                <!-- Linha unificada: Data da Compra e Cartão lado a lado -->
                <div class="grid-data-cartao">
                    <div class="col-span-6">
                        <label for="input-data">Data da Compra</label>
                        <input type="date" id="input-data">
                    </div>
                    <div class="col-span-6">
                        <label>Cartão</label>
                        <div class="selecao-grid" style="margin-top: 0.125rem;">
                            <div id="card-cartao-visa10" class="pill-card ativo" onclick="selecionarCartao('Visa - 10')">Visa 10</div>
                            <div id="card-cartao-visa25" class="pill-card" onclick="selecionarCartao('Visa - 25')">Visa 25</div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="label-usuario-margin">Usuário</label>
                    <div class="usuarios-grid">
                        <div id="card-usuario-jairo" class="pill-card ativo" onclick="selecionarUsuario('Jairo')">
                            <span class="usuario-texto">Jairo</span>
                        </div>
                        <div id="card-usuario-katia" class="pill-card" onclick="selecionarUsuario('Kátia')">
                            <span class="usuario-texto">Kátia</span>
                        </div>
                        <div id="card-usuario-juliana" class="pill-card" onclick="selecionarUsuario('Juliana')">
                            <span class="usuario-texto">Juliana</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="input-estabelecimento">Estabelecimento</label>
                    <input type="text" id="input-estabelecimento" placeholder="Ex: Supermercado, Loja..." oninput="verificarPreenchimentoFormulario()">
                </div>

                <div class="grid-data-cartao">
                    <div class="col-span-6">
                        <label for="input-valor">Valor Total (R$)</label>
                        <input type="number" id="input-valor" step="0.01" placeholder="0,00" oninput="verificarPreenchimentoFormulario()">
                    </div>
                    <div class="col-span-6">
                        <label for="input-parcelas-total">Nº de Parcelas</label>
                        <input type="number" id="input-parcelas-total" min="1" value="1" placeholder="Ex: 10" style="text-align: center;" oninput="verificarPreenchimentoFormulario()">
                    </div>
                </div>

                <!-- ALERTA -->
                <div id="app-alerta" class="app-alerta-box hidden"></div>

                <!-- Botão Padrão (Novo Lançamento) -->
                <button id="btn-salvar" class="btn-acao btn-desativado" onclick="salvarOuAtualizarRegistro()" disabled>Salvar Lançamento</button>

                <!-- Botões de Edição Divididos -->
                <div id="botoes-edicao-container" class="botoes-edicao-container">
                    <button type="button" id="btn-confirma" class="btn-acao btn-confirma-edicao" onclick="salvarOuAtualizarRegistro()">Confirma</button>
                    <button type="button" id="btn-cancela" class="btn-acao btn-cancela-edicao" onclick="cancelarEdicao()">Cancela</button>
                </div>
            </div>

            <!-- Histórico -->
            <div class="glass-card">
                <div class="flex justify-between items-center historico-header" style="margin-bottom: 0.5rem;">
                    <p class="historico-title">Histórico da Fatura</p>
                    <span id="total-geral" class="badge-total">Total: R$ 0,00</span>
                </div>

                <!-- Seletor de Mês do Histórico (Fatura) -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 0.375rem 0.625rem; border-radius: 0.5rem; margin-bottom: 0.75rem; border: 1px solid var(--border-light);">
                    <button onclick="mudarMesHistorico(-1)" style="background: none; border: none; cursor: pointer; font-weight: bold; color: var(--emerald-main); padding: 0.25rem 0.5rem;" title="Mês Anterior">◀</button>
                    <span id="label-mes-filtro" style="font-size: 11px; font-weight: 600; color: var(--text-main);">Fatura Atual</span>
                    <button onclick="mudarMesHistorico(1)" style="background: none; border: none; cursor: pointer; font-weight: bold; color: var(--emerald-main); padding: 0.25rem 0.5rem;" title="Próximo Mês">▶</button>
                </div>

                <div class="overflow-y-auto max-h-registros">
                    <ul id="lista-registros" class="lista-vazia-ul">
                        <li class="lista-carregando-li">Carregando registros...</li>
                    </ul>
                </div>
            </div>

            <!-- Backup / Importação -->
            <div class="glass-card backup-card-padding">
                <div class="flex gap-2 items-center">
                    <button class="btn-backup" onclick="exportarBackup()">💾 Exportar Backup</button>
                    <label class="btn-backup btn-importar-label">
                        📂 Importar Backup
                        <input type="file" id="input-importar" accept=".sqlite" style="display: none;" onchange="importarBackup(event)">
                    </label>
                </div>
                <div id="container-link-download" class="container-download-margin hidden"></div>
            </div>

        </section>

        <!-- SEÇÃO: RESUMO -->
        <section id="secao-resumo" class="hidden flex-col gap-3">
            <div class="glass-card">
                <p class="resumo-main-title">Resumo Consolidado por Cartão</p>
                <div id="conteudo-resumo" class="conteudo-resumo-flex overflow-y-auto max-h-resumo">
                    <p class="resumo-carregando-p">Calculando resumo...</p>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="app.js"></script>
</body>
</html>
