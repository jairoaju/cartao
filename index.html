<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PWA Controle de Cartão</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- sql.js (SQLite para WebAssembly) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="p-4 bg-slate-800 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400">Gastos do Cartão</h1>
        <span id="status-db" class="text-xs bg-amber-700/50 px-2 py-1 rounded text-amber-200">Carregando SQLite...</span>
    </header>

    <!-- Barra de Navegação -->
    <nav class="bg-slate-800/80 border-b border-slate-700 flex px-4 gap-2">
        <button onclick="mudarAba('lancamentos')" id="tab-lancamentos" 
            class="py-3 px-4 text-sm font-semibold border-b-2 border-emerald-500 text-emerald-400 transition-all">
            📝 Lançamentos
        </button>
        <button onclick="mudarAba('resumo')" id="tab-resumo" 
            class="py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all">
            📊 Resumo por Cartão
        </button>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col gap-4">
        
        <!-- SEÇÃO 1: Lançamentos -->
        <div id="secao-lancamentos" class="flex flex-col gap-4 flex-1">
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col gap-3">
                <h2 class="text-sm font-semibold text-emerald-400 uppercase tracking-wide">Novo Lançamento</h2>
                
                <div>
                    <label for="input-data" class="block text-xs font-medium mb-1 text-slate-400">Data:</label>
                    <input type="date" id="input-data" 
                        class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium mb-1.5 text-slate-400">Cartão:</label>
                    <div class="grid grid-cols-2 gap-2 bg-slate-900 p-2 border border-slate-700 rounded-lg">
                        <label class="flex items-center justify-center gap-1.5 cursor-pointer text-xs p-2 rounded hover:bg-slate-800 text-slate-200 transition-colors">
                            <input type="radio" name="cartao" value="Visa - 10" checked onchange="gerenciarRestricoesCartao()" class="accent-emerald-500"> Visa - 10
                        </label>
                        <label class="flex items-center justify-center gap-1.5 cursor-pointer text-xs p-2 rounded hover:bg-slate-800 text-slate-200 transition-colors">
                            <input type="radio" name="cartao" value="Visa - 25" onchange="gerenciarRestricoesCartao()" class="accent-emerald-500"> Visa - 25
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium mb-1.5 text-slate-400">Usuário:</label>
                    <div class="grid grid-cols-3 gap-2 bg-slate-900 p-2 border border-slate-700 rounded-lg">
                        <label class="flex items-center justify-center gap-1.5 cursor-pointer text-xs p-2 rounded hover:bg-slate-800 text-slate-200 transition-colors">
                            <input type="radio" name="usuario" value="Jairo" checked class="accent-emerald-500"> Jairo
                        </label>
                        <label class="flex items-center justify-center gap-1.5 cursor-pointer text-xs p-2 rounded hover:bg-slate-800 text-slate-200 transition-colors">
                            <input type="radio" name="usuario" value="Kátia" class="accent-emerald-500"> Kátia
                        </label>
                        <label id="label-juliana" class="flex items-center justify-center gap-1.5 cursor-pointer text-xs p-2 rounded hover:bg-slate-800 text-slate-200 transition-colors">
                            <input type="radio" id="radio-juliana" name="usuario" value="Juliana" class="accent-emerald-500"> Juliana
                        </label>
                    </div>
                </div>

                <div>
                    <label for="input-estabelecimento" class="block text-xs font-medium mb-1 text-slate-400">Estabelecimento:</label>
                    <input type="text" id="input-estabelecimento" placeholder="Ex: Supermercado, Posto..."
                        class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 text-sm placeholder-slate-600">
                </div>

                <div>
                    <label for="input-valor" class="block text-xs font-medium mb-1 text-slate-400">Valor (R$):</label>
                    <input type="number" step="0.01" id="input-valor" placeholder="0,00"
                        class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 text-sm placeholder-slate-600">
                </div>
                
                <button id="btn-salvar" onclick="salvarRegistro()" disabled
                    class="mt-1 w-full bg-slate-700 text-slate-400 font-semibold py-3 px-4 rounded-lg shadow-md flex items-center justify-center gap-2 cursor-not-allowed transition-all">
                    Salvar Lançamento
                </button>
            </div>

            <!-- Tabela de Registros -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-md font-semibold text-slate-300">Histórico de Gastos</h2>
                    <span id="total-geral" class="text-xs font-mono text-emerald-400 font-bold bg-slate-900 px-2 py-1 rounded border border-slate-700">Total: R$ 0,00</span>
                </div>
                <div class="overflow-y-auto flex-1 max-h-[30vh]">
                    <ul id="lista-registros" class="space-y-2">
                        <li class="text-slate-500 text-sm text-center py-4">Aguardando inicialização do banco...</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- SEÇÃO 2: Resumo -->
        <div id="secao-resumo" class="hidden flex-col gap-4 flex-1">
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex-1 flex flex-col">
                <h2 class="text-md font-semibold text-slate-300 mb-3">Totais e Subtotais por Usuário</h2>
                <div class="overflow-y-auto flex-1 max-h-[60vh]">
                    <div id="conteudo-resumo" class="space-y-4">
                        <p class="text-slate-500 text-sm text-center py-4">Carregando resumo...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let db = null;
        const STORAGE_KEY = "sqlite_cartao_backup_v6";

        function definirDataHoje() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            document.getElementById('input-data').value = `${ano}-${mes}-${dia}`;
        }
        definirDataHoje();

        function gerenciarRestricoesCartao() {
            const cartaoSelecionado = document.querySelector('input[name="cartao"]:checked').value;
            const radioJuliana = document.getElementById("radio-juliana");
            const labelJuliana = document.getElementById("label-juliana");

            if (cartaoSelecionado === "Visa - 10") {
                if (radioJuliana.checked) {
                    document.querySelector('input[name="usuario"][value="Jairo"]').checked = true;
                }
                radioJuliana.disabled = true;
                labelJuliana.classList.add("opacity-40", "cursor-not-allowed");
            } else {
                radioJuliana.disabled = false;
                labelJuliana.classList.remove("opacity-40", "cursor-not-allowed");
            }
        }
        gerenciarRestricoesCartao();

        initSqlJs({
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        }).then(SQL => {
            const savedDbHex = localStorage.getItem(STORAGE_KEY);
            if (savedDbHex) {
                const binaryData = new Uint8Array(savedDbHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                db = new SQL.Database(binaryData);
            } else {
                db = new SQL.Database();
            }

            db.run(`
                CREATE TABLE IF NOT EXISTS cartao_gastos (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    data TEXT NOT NULL,
                    cartao TEXT NOT NULL,
                    dono_do_cartao TEXT NOT NULL,
                    estabelecimento TEXT NOT NULL,
                    valor REAL NOT NULL
                );
            `);

            document.getElementById("status-db").className = "text-xs bg-emerald-900/50 px-2 py-1 rounded text-emerald-300";
            document.getElementById("status-db").textContent = "SQLite Ativo (Offline Ready)";
            
            const btn = document.getElementById("btn-salvar");
            btn.disabled = false;
            btn.className = "mt-1 w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all text-white font-semibold py-3 px-4 rounded-lg shadow-md flex items-center justify-center gap-2 cursor-pointer";

            atualizarAplicacao();
        }).catch(err => {
            console.error("Erro ao carregar sql.js:", err);
            document.getElementById("status-db").textContent = "Erro no SQLite / Offline";
        });

        function persistirBanco() {
            if (!db) return;
            const binaryArray = db.export();
            const hexString = Array.from(binaryArray).map(b => b.toString(16).padStart(2, '0')).join('');
            localStorage.setItem(STORAGE_KEY, hexString);
        }

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        }

        function formatarDataBR(dataIso) {
            if (!dataIso) return '';
            const partes = dataIso.split('-');
            return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dataIso;
        }

        function mudarAba(aba) {
            const secLancamentos = document.getElementById("secao-lancamentos");
            const secResumo = document.getElementById("secao-resumo");
            const tabLanc = document.getElementById("tab-lancamentos");
            const tabRes = document.getElementById("tab-resumo");

            if (aba === 'lancamentos') {
                secLancamentos.classList.remove("hidden");
                secLancamentos.classList.add("flex");
                secResumo.classList.remove("flex");
                secResumo.classList.add("hidden");
                tabLanc.className = "py-3 px-4 text-sm font-semibold border-b-2 border-emerald-500 text-emerald-400 transition-all";
                tabRes.className = "py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all";
            } else {
                secResumo.classList.remove("hidden");
                secResumo.classList.add("flex");
                secLancamentos.classList.remove("flex");
                secLancamentos.classList.add("hidden");
                tabRes.className = "py-3 px-4 text-sm font-semibold border-b-2 border-emerald-500 text-emerald-400 transition-all";
                tabLanc.className = "py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all";
                gerarResumoPorCartao();
            }
        }

        function atualizarAplicacao() {
            carregarRegistros();
        }

        function carregarRegistros() {
            if (!db) return;
            const lista = document.getElementById("lista-registros");
            lista.innerHTML = "";
            try {
                const stmt = db.prepare("SELECT id, data, cartao, dono_do_cartao, estabelecimento, valor FROM cartao_gastos ORDER BY data DESC, id DESC");
                const registros = [];
                let somaTotal = 0;
                while (stmt.step()) { registros.push(stmt.get()); }
                stmt.free();

                if (registros.length === 0) {
                    lista.innerHTML = '<li class="text-slate-500 text-sm text-center py-4">Nenhum lançamento encontrado.</li>';
                    document.getElementById("total-geral").textContent = "Total: R$ 0,00";
                    return;
                }

                registros.forEach(reg => {
                    const [id, data, cartao, dono, estabelecimento, valor] = reg;
                    somaTotal += valor;
                    const li = document.createElement("li");
                    li.className = "bg-slate-900 p-3 rounded-lg border border-slate-700/50 flex justify-between items-center gap-2";
                    
                    li.innerHTML = `
                        <div class="flex flex-col gap-0.5 flex-1">
                            <div class="flex justify-between items-center text-xs text-slate-400 font-mono">
                                <span>📅 ${formatarDataBR(data)}</span> 
                                <span class="text-emerald-400 font-bold">${formatarMoeda(valor)}</span>
                            </div>
                            <p class="text-slate-100 text-sm font-semibold mt-1">${estabelecimento}</p>
                            <span class="text-[11px] text-slate-400">💳 ${cartao} • Usuário: ${dono}</span>
                        </div>
                        <button onclick="excluirRegistro(${id}, '${estabelecimento}', ${valor})" class="text-slate-500 hover:text-red-400 p-2 transition-colors text-sm" title="Excluir">🗑️</button>
                    `;
                    lista.appendChild(li);
                });
                document.getElementById("total-geral").textContent = `Total: ${formatarMoeda(somaTotal)}`;
            } catch (e) {
                console.error("Erro ao consultar SQL:", e);
            }
        }

        function gerarResumoPorCartao() {
            if (!db) return;
            const container = document.getElementById("conteudo-resumo");
            container.innerHTML = "";
            const cartoesFixos = ["Visa - 10", "Visa - 25"];

            cartoesFixos.forEach(cartao => {
                try {
                    const stmt = db.prepare("SELECT data, dono_do_cartao, estabelecimento, valor FROM cartao_gastos WHERE cartao = ? ORDER BY dono_do_cartao ASC, data DESC");
                    stmt.bind([cartao]);
                    const registros = [];
                    let totalCartao = 0;
                    const subtotaisPorDono = {};

                    while (stmt.step()) {
                        const [data, dono, estabelecimento, valor] = stmt.get();
                        registros.push({ data, dono, estabelecimento, valor });
                        totalCartao += valor;
                        subtotaisPorDono[dono] = (subtotaisPorDono[dono] || 0) + valor;
                    }
                    stmt.free();

                    const cardDiv = document.createElement("div");
                    cardDiv.className = "bg-slate-900 p-3.5 rounded-lg border border-slate-700/70 flex flex-col gap-3";
                    cardDiv.innerHTML = `
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <span class="font-bold text-emerald-400 text-sm">💳 Cartão: ${cartao}</span> 
                            <span class="font-mono text-xs font-bold text-slate-200 bg-slate-800 px-2 py-1 rounded">Total: ${formatarMoeda(totalCartao)}</span>
                        </div>
                    `;

                    if (registros.length === 0) {
                        cardDiv.innerHTML += `<p class="text-xs text-slate-500 text-center py-2">Nenhum lançamento registrado neste cartão.</p>`;
                    } else {
                        let subHtml = `<div class="bg-slate-800/60 p-2.5 rounded border border-slate-800 flex flex-col gap-1"><span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Subtotais por Usuário:</span>`;
                        for (const [dono, subtotal] of Object.entries(subtotaisPorDono)) {
                            subHtml += `<div class="flex justify-between items-center text-xs text-slate-300 font-mono"><span>👤 ${dono}</span> <span class="text-emerald-300 font-bold">${formatarMoeda(subtotal)}</span></div>`;
                        }
                        subHtml += `</div>`;
                        cardDiv.innerHTML += subHtml;

                        let itensHtml = `<span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mt-1">Lançamentos:</span><ul class="space-y-1.5">`;
                        registros.forEach(g => {
                            itensHtml += `<li class="flex justify-between items-center text-xs text-slate-300 bg-slate-800/40 p-2 rounded"><span><strong class="text-slate-400">👤 ${g.dono}</strong> • ${formatarDataBR(g.data)} - ${g.estabelecimento}</span> <span class="font-mono text-emerald-300">${formatarMoeda(g.valor)}</span></li>`;
                        });
                        itensHtml += `</ul>`;
                        cardDiv.innerHTML += itensHtml;
                    }
                    container.appendChild(cardDiv);
                } catch (e) {
                    console.error("Erro ao gerar resumo:", e);
                }
            });
        }

        function salvarRegistro() {
            if (!db) return;
            const data = document.getElementById("input-data").value;
            const cartao = document.querySelector('input[name="cartao"]:checked')?.value;
            const dono = document.querySelector('input[name="usuario"]:checked')?.value;
            const estabelecimento = document.getElementById("input-estabelecimento").value.trim();
            const valorInput = document.getElementById("input-valor").value;
            
            if (!data || !cartao || !dono || !estabelecimento || !valorInput) {
                alert("Por favor, preencha todos os campos!");
                return;
            }

            const valor = parseFloat(valorInput);
            if (isNaN(valor) || valor <= 0) {
                alert("Insira um valor válido em reais!");
                return;
            }

            const stmt = db.prepare("INSERT INTO cartao_gastos (data, cartao, dono_do_cartao, estabelecimento, valor) VALUES (?, ?, ?, ?, ?)");
            stmt.run([data, cartao, dono, estabelecimento, valor]);
            stmt.free();

            persistirBanco();
            document.getElementById("input-estabelecimento").value = "";
            document.getElementById("input-valor").value = "";
            definirDataHoje();
            document.getElementById("input-estabelecimento").focus();
            atualizarAplicacao();
        }

        function excluirRegistro(id, estabelecimento, valor) {
            if (!db) return;
            if (!confirm(`Deseja excluir o lançamento de ${formatarMoeda(valor)} em "${estabelecimento}"?`)) return;

            const stmt = db.prepare("DELETE FROM cartao_gastos WHERE id = ?");
            stmt.run([id]);
            stmt.free();

            persistirBanco();
            atualizarAplicacao();
        }
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
        });
      }
    </script>
</body>
</html>
