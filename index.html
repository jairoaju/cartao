<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PWA Controle de Cartão</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- sql.js (SQLite para WebAssembly) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    
    <!-- Estilos Externos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Moderno com Efeito Glass -->
    <header>
        <div class="flex items-center gap-2">
            <span style="font-size: 1.25rem;">💳</span>
            <h1 style="font-size: 1.125rem; margin: 0; font-weight: bold; letter-spacing: -0.025em; color: var(--emerald-main);">Controle de Cartão</h1>
        </div>
    </header>

    <!-- Barra de Navegação Estilo Pílula / Segmented Control -->
    <nav>
        <button onclick="mudarAba('lancamentos')" id="tab-lancamentos" class="tab-btn tab-ativa">
            📝 Lançamentos
        </button>
        <button onclick="mudarAba('resumo')" id="tab-resumo" class="tab-btn tab-inativa">
            📊 Resumo por Cartão
        </button>
    </nav>

    <!-- Conteúdo Principal -->
    <main>
        
        <!-- SEÇÃO 1: Lançamentos -->
        <div id="secao-lancamentos" class="flex flex-col gap-3" style="flex: 1;">
            <div class="glass-card" style="position: relative;">
                
                <h2 id="titulo-formulario" style="font-size: 11px; font-weight: bold; color: var(--emerald-main); text-transform: uppercase; letter-spacing: 0.05em; margin: 0;">Novo Lançamento</h2>
                
                <!-- Data e Cartão -->
                <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0.5rem; align-items: end;">
                    <div style="grid-column: span 6 / span 6; display: flex; flex-direction: column;">
                        <label for="input-data">Data:</label>
                        <input type="date" id="input-data">
                    </div>

                    <div style="grid-column: span 6 / span 6; display: flex; flex-direction: column;">
                        <label>Cartão:</label>
                        <div class="selecao-grid">
                            <div onclick="selecionarCartao('Visa - 10')" id="card-cartao-visa10" class="pill-card ativo" style="justify-content: center;">
                                Visa 10
                            </div>
                            <div onclick="selecionarCartao('Visa - 25')" id="card-cartao-visa25" class="pill-card" style="justify-content: center;">
                                Visa 25
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Usuário -->
                <div>
                    <label style="margin-bottom: 0.375rem;">Usuário:</label>
                    <div class="usuarios-grid">
                        <div onclick="selecionarUsuario('Jairo')" id="card-usuario-jairo" class="pill-card ativo">
                            <span style="font-size: 12px; font-weight: bold;">Jairo</span>
                        </div>
                        <div onclick="selecionarUsuario('Kátia')" id="card-usuario-katia" class="pill-card">
                            <span style="font-size: 12px; font-weight: bold;">Kátia</span>
                        </div>
                        <div onclick="selecionarUsuario('Juliana')" id="card-usuario-juliana" class="pill-card">
                            <span style="font-size: 12px; font-weight: bold;">Juliana</span>
                        </div>
                    </div>
                </div>

                <!-- Estabelecimento -->
                <div>
                    <label for="input-estabelecimento">Estabelecimento:</label>
                    <input type="text" id="input-estabelecimento" placeholder="Ex: Supermercado, Posto...">
                </div>

                <!-- Valor -->
                <div>
                    <label for="input-valor">Valor (R$):</label>
                    <input type="number" step="0.01" id="input-valor" placeholder="0,00">
                </div>
                
                <button id="btn-salvar" onclick="salvarOuAtualizarRegistro()" disabled class="btn-acao btn-desativado">
                    Salvar Lançamento
                </button>

                <button id="btn-cancelar" onclick="cancelarEdicao()" style="display: none; background-color: #e2e8f0; color: #334155; font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.75rem; border: none; cursor: pointer; font-size: 12px; width: 100%;">
                    Cancelar Edição
                </button>

                <div id="app-alerta" class="hidden" style="padding: 0.75rem; border-radius: 0.75rem; font-size: 12px; font-weight: 500; border: 1px solid transparent;"></div>
            </div>

            <!-- Tabela de Registros -->
            <div class="glass-card" style="flex: 1;">
                <div class="flex justify-between items-center" style="margin-bottom: 0.75rem;">
                    <h2 style="font-size: 11px; font-weight: bold; color: var(--text-muted-light); text-transform: uppercase; letter-spacing: 0.05em; margin: 0;">Histórico de Gastos</h2>
                    <span id="total-geral" class="badge-total">Total: R$ 0,00</span>
                </div>
                <div class="overflow-y-auto max-h-registros" style="flex: 1;">
                    <ul id="lista-registros" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem;">
                        <li style="color: var(--text-muted-light); font-size: 12px; text-align: center; padding: 1rem 0;">Carregando dados...</li>
                    </ul>
                </div>
            </div>

            <!-- Backup / Gerenciamento -->
            <div class="glass-card" style="padding: 0.75rem;">
                <span style="font-size: 11px; color: var(--text-muted-light); font-weight: 500;">Backup dos Dados:</span>
                <div class="flex gap-2">
                    <button onclick="exportarBackup()" style="flex: 1; background-color: #e2e8f0; color: #334155; font-size: 12px; font-weight: 600; padding: 0.5rem; border-radius: 0.75rem; border: 1px solid #cbd5e1; cursor: pointer;">
                        💾 Exportar
                    </button>
                    <label style="flex: 1; background-color: #e2e8f0; color: #334155; font-size: 12px; font-weight: 600; padding: 0.5rem; border-radius: 0.75rem; border: 1px solid #cbd5e1; text-align: center; cursor: pointer; margin: 0;">
                        📂 Importar
                        <input type="file" id="input-importar" accept=".sqlite,.db" onchange="importarBackup(event)" class="hidden">
                    </label>
                </div>
                <div id="container-link-download" class="hidden" style="margin-top: 0.25rem;"></div>
            </div>
        </div>

        <!-- SEÇÃO 2: Resumo -->
        <div id="secao-resumo" class="hidden flex-col gap-3" style="flex: 1;">
            <div class="glass-card" style="flex: 1;">
                <h2 style="font-size: 11px; font-weight: bold; color: var(--text-muted-light); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0;">Totais e Subtotais por Usuário</h2>
                <div class="overflow-y-auto max-h-resumo" style="flex: 1;">
                    <div id="conteudo-resumo" style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <p style="color: var(--text-muted-light); font-size: 12px; text-align: center; padding: 1rem 0;">Carregando resumo...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Externo -->
    <script src="app.js"></script>
</body>
</html>
