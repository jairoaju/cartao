<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciador de Cartão de Crédito</title>
    <meta name="theme-color" id="meta-theme-color" content="#ffffff">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- sql.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <h1 class="header-title">Gerenciador de Faturas</h1>
        
        <!-- MENU HAMBÚRGUER DE OPÇÕES -->
        <div class="menu-container">
            <button id="btn-menu-principal" onclick="alternarMenuOpcoes(event)" title="Menu de Opções">
                ☰
            </button>
            
            <div id="dropdown-menu-opcoes" class="hidden">
                <button onclick="alternarTema(); fecharMenuOpcoes();" class="dropdown-item">
                    <span id="icone-menu-tema">☀️</span> <span id="texto-menu-tema">Modo Claro</span>
                </button>

                <div class="dropdown-divider"></div>

                <button onclick="exportarBackup(); fecharMenuOpcoes();" class="dropdown-item">
                    💾 Exportar Backup
                </button>

                <label class="dropdown-item" style="cursor: pointer;">
                    📂 Importar Backup
                    <input type="file" id="input-importar-menu" accept=".sqlite" onchange="importarBackup(event); fecharMenuOpcoes();" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <!-- Alerta de Feedback -->
        <div id="app-alerta" class="app-alerta-box hidden"></div>

        <!-- Abas de Navegação -->
        <nav>
            <button id="tab-lancamentos" class="tab-btn tab-ativa" onclick="mudarAba('lancamentos')">Lançamentos</button>
            <button id="tab-resumo" class="tab-btn tab-inativa" onclick="mudarAba('resumo')">Resumo por Cartão</button>
        </nav>

        <!-- SEÇÃO: LANÇAMENTOS -->
        <section id="secao-lancamentos" class="flex flex-col gap-3">
            <!-- Formulário -->
            <div class="glass-card card-formulario">
                <h2 id="titulo-formulario" class="form-title">Novo Lançamento</h2>
                
                <div class="flex flex-col gap-3">
                    <!-- Linha: Data da Compra e Fatura Lado a Lado -->
                    <div class="grid-data-fatura">
                        <div style="grid-column: 1 / 6;"> <!-- Ocupa colunas 1 a 5 -->
                            <label>Data da Compra</label>
                            <input type="date" id="input-data" class="font-mono" onchange="aoMudarDataCompra(); verificarPreenchimentoFormulario()">
                        </div>
                        <div style="grid-column: 6 / 13;"> <!-- Ocupa colunas 6 a 12 -->
                            <label>Fatura</label>
                            <input type="month" id="input-fatura" class="font-mono" onchange="verificarPreenchimentoFormulario()" oninput="verificarPreenchimentoFormulario()" onblur="garantirFaturaValida()">
                        </div>
                    </div>
                    <!-- Seleção de Cartão -->
                    <div>
                        <label>Cartão</label>
                        <div class="selecao-grid">
                            <div id="card-cartao-visa10" class="pill-card ativo" onclick="selecionarCartao('Visa - 10')">Visa - 10</div>
                            <div id="card-cartao-visa25" class="pill-card" onclick="selecionarCartao('Visa - 25')">Visa - 25</div>
                        </div>
                    </div>

                    <!-- Seleção de Usuário -->
                    <div>
                        <label>Usuário</label>
                        <div class="selecao-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
                            <div id="card-usuario-jairo" class="pill-card ativo" onclick="selecionarUsuario('Jairo')">Jairo</div>
                            <div id="card-usuario-katia" class="pill-card" onclick="selecionarUsuario('Kátia')">Kátia</div>
                            <div id="card-usuario-juliana" class="pill-card" onclick="selecionarUsuario('Juliana')">Juliana</div>
                        </div>
                    </div>

                    <div>
                        <label>Estabelecimento</label>
                        <input type="text" id="input-estabelecimento" placeholder="Ex: Supermercado" oninput="verificarPreenchimentoFormulario()">
                    </div>

                    <div class="grid-data-cartao">
                        <div style="grid-column: span 6 / span 6;">
                            <label>Valor Total (R$)</label>
                            <input type="number" step="0.01" id="input-valor" class="font-mono" placeholder="0,00" oninput="verificarPreenchimentoFormulario()">
                        </div>
                        <div style="grid-column: span 6 / span 6;">
                            <label>Parcelas</label>
                            <input type="number" min="1" value="1" id="input-parcelas-total" class="font-mono" oninput="verificarPreenchimentoFormulario()">
                        </div>
                    </div>

                    <!-- Botões de Ação -->
                    <div>
                        <button id="btn-salvar" class="btn-acao btn-desativado" onclick="salvarOuAtualizarRegistro()" disabled>Salvar Lançamento</button>
                        
                        <div id="botoes-edicao-container" class="botoes-edicao-container">
                            <button id="btn-cancela" class="btn-acao btn-cancela-edicao" onclick="cancelarEdicao()">Cancelar</button>
                            <button id="btn-confirma" class="btn-acao btn-confirma-edicao" onclick="salvarOuAtualizarRegistro()" disabled>Atualizar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de Lançamentos do Mês -->
            <div class="glass-card">
                <div class="flex justify-between items-center historico-header">
                    <button onclick="mudarMesHistorico(-1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">◀</button>
                    <span id="label-mes-filtro" class="historico-title" style="font-size: 12px;">Fatura: ---</span>
                    <button onclick="mudarMesHistorico(1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">▶</button>
                </div>

                <ul id="lista-registros" class="lista-vazia-ul overflow-y-auto max-h-registros">
                    <!-- Preenchido via JS -->
                </ul>

                <div id="total-geral" style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border-light); font-size: 12px; font-weight: bold; text-align: right;" class="font-mono badge-total">
                    Total: R$ 0,00
                </div>
            </div>
        </section>

        <!-- SEÇÃO: RESUMO POR CARTÃO -->
        <section id="secao-resumo" class="hidden flex-col gap-3">
            <div class="glass-card">
                <div class="flex justify-between items-center historico-header">
                    <button onclick="mudarMesResumo(-1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">◀</button>
                    <span id="label-mes-resumo" class="resumo-main-title" style="font-size: 12px;">Fatura: ---</span>
                    <button onclick="mudarMesResumo(1)" style="background: none; border: none; cursor: pointer; font-size: 14px; color: var(--text-muted-light);">▶</button>
                </div>

                <div id="conteudo-resumo" class="conteudo-resumo-flex overflow-y-auto max-h-resumo">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
