<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="meta-theme-color" name="theme-color" content="#ffffff">
    <title>Controle de Cartões</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- sql.js para gerenciar banco de dados SQLite local -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 transition-colors duration-200 min-h-screen flex flex-col pb-16">

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto w-full p-4 flex flex-col gap-4 flex-1">

        <!-- Bloco de Alerta do Sistema -->
        <div id="app-alerta" class="hidden text-xs font-medium p-3 rounded-xl border transition-all duration-200 text-center shadow-sm"></div>

        <!-- Abas de Navegação -->
        <nav class="flex rounded-xl p-1 bg-slate-200/70 dark:bg-slate-800 gap-1 select-none">
            <button id="tab-lancamentos" onclick="mudarAba('lancamentos')" class="tab-btn tab-ativa flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer">Lançamentos</button>
            <button id="tab-resumo" onclick="mudarAba('resumo')" class="tab-btn tab-inativa flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer">Resumo por Cartão</button>
        </nav>

        <!-- SEÇÃO 1: LANÇAMENTOS -->
        <section id="secao-lancamentos" class="flex flex-col gap-4">

            <!-- Card de Formulário -->
            <div class="card-base p-4 rounded-2xl flex flex-col gap-3 shadow-sm border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
                
                <div class="flex justify-between items-center">
                    <h2 id="titulo-formulario" class="text-xs font-bold uppercase tracking-wider text-sky-600 dark:text-sky-400">Novo Lançamento</h2>
                </div>

                <!-- Seleção de Cartão -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Cartão</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="card-cartao-visa10" onclick="selecionarCartao('Visa - 10')" class="pill-card py-2 px-3 rounded-xl border font-mono text-xs font-bold text-center transition-all cursor-pointer">Visa - 10</button>
                        <button type="button" id="card-cartao-visa25" onclick="selecionarCartao('Visa - 25')" class="pill-card py-2 px-3 rounded-xl border font-mono text-xs font-bold text-center transition-all cursor-pointer">Visa - 25</button>
                    </div>
                </div>

                <!-- Seleção de Usuário -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Usuário</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button type="button" id="card-usuario-jairo" onclick="selecionarUsuario('Jairo')" class="pill-card py-1.5 px-2 rounded-xl border text-[11px] font-bold text-center transition-all cursor-pointer">Jairo</button>
                        <button type="button" id="card-usuario-katia" onclick="selecionarUsuario('Kátia')" class="pill-card py-1.5 px-2 rounded-xl border text-[11px] font-bold text-center transition-all cursor-pointer">Kátia</button>
                        <button type="button" id="card-usuario-juliana" onclick="selecionarUsuario('Juliana')" class="pill-card py-1.5 px-2 rounded-xl border text-[11px] font-bold text-center transition-all cursor-pointer">Juliana</button>
                    </div>
                </div>

                <!-- Data e Fatura -->
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col gap-1">
                        <label for="input-data" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Data Compra</label>
                        <input type="date" id="input-data" class="input-base font-mono text-xs p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="input-fatura" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Mês Fatura</label>
                        <div class="flex items-center gap-1.5">
                            <input type="month" id="input-fatura" onchange="atualizarTextoFaturaVisual()" class="input-base font-mono text-xs p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 flex-1">
                            <span id="fatura-visual" class="text-[11px] font-mono font-bold text-sky-600 dark:text-sky-400 px-1 whitespace-nowrap">--/--</span>
                        </div>
                    </div>
                </div>

                <!-- Estabelecimento -->
                <div class="flex flex-col gap-1">
                    <label for="input-estabelecimento" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Estabelecimento</label>
                    <input type="text" id="input-estabelecimento" oninput="verificarPreenchimentoFormulario()" placeholder="Ex: Supermercado" class="input-base text-xs p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <!-- Valor e Parcelas -->
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col gap-1">
                        <label for="input-valor" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Valor (R$)</label>
                        <input type="number" step="0.01" id="input-valor" oninput="verificarPreenchimentoFormulario()" placeholder="0,00" class="input-base font-mono text-xs p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="input-parcelas-total" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Parcelas</label>
                        <input type="number" min="1" value="1" id="input-parcelas-total" oninput="verificarPreenchimentoFormulario()" class="input-base font-mono text-xs p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="mt-1">
                    <button type="button" id="btn-salvar" onclick="salvarOuAtualizarRegistro()" disabled class="btn-acao btn-desativado w-full py-2.5 px-4 rounded-xl font-bold text-xs transition-all cursor-pointer">Salvar Lançamento</button>
                    
                    <div id="botoes-edicao-container" style="display: none !important;" class="grid-cols-2 gap-2">
                        <button type="button" onclick="cancelarEdicao()" class="btn-acao bg-slate-200 hover:bg-slate-300 text-slate-700 dark:bg-slate-800 dark:text-slate-300 py-2.5
